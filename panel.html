<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buyer Test Store — Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0c0c10;
      --surface: #13131a;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --border-active: rgba(139,92,246,0.6);
      --accent: #8b5cf6;
      --accent-light: #a78bfa;
      --accent-dim: rgba(139,92,246,0.15);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.12);
      --text: #e2e2f0;
      --text-muted: #6b6b85;
      --text-dim: #9595b0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52,211,153,0.05) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    .header {
      margin-bottom: 28px;
      padding: 0 4px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-dim);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-light);
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand-name span {
      color: var(--accent-light);
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      padding-left: 48px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--green);
      background: var(--green-dim);
      border: 1px solid rgba(52,211,153,0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .card-body {
      padding: 24px;
    }

    /* Section */
    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 12px;
      background: var(--accent);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Field */
    .field {
      margin-bottom: 14px;
    }

    .field:last-child { margin-bottom: 0; }

    .field label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .field label .req {
      color: var(--accent-light);
      font-size: 0.7rem;
    }

    .field label .opt {
      color: var(--text-muted);
      opacity: 0.5;
      font-size: 0.55rem;
    }

    input, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.45;
    }

    input:focus, textarea:focus {
      border-color: var(--border-active);
      background: rgba(139,92,246,0.05);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }

    textarea {
      resize: none;
      height: 80px;
      color: var(--red);
      line-height: 1.5;
    }

    textarea:focus {
      border-color: rgba(248,113,113,0.5);
      background: rgba(248,113,113,0.04);
      box-shadow: 0 0 0 3px rgba(248,113,113,0.08);
    }

    /* Divider */
    .sep {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Maint hint */
    .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.6;
    }

    .hint b { color: var(--red); font-weight: 500; }

    /* Button */
    .btn-wrap {
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      opacity: 0.9;
      box-shadow: 0 4px 24px rgba(139,92,246,0.4);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.5;
      align-items: flex-start;
      gap: 10px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert.show { display: flex; }

    .alert-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .alert.success {
      background: var(--green-dim);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--green);
    }

    .alert.error {
      background: var(--red-dim);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--red);
    }

    .alert.loading {
      background: var(--accent-dim);
      border: 1px solid rgba(139,92,246,0.25);
      color: var(--accent-light);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-muted);
      opacity: 0.4;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="brand-row">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-name">Buyer <span>Test Store</span></div>
      </div>
      <div class="brand-sub">apk server configuration panel</div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">APK Server Configuration</div>
        <div class="status-badge">
          <div class="status-dot"></div>
          online
        </div>
      </div>

      <div class="card-body">
        <div class="section-title">Server Info</div>

        <div class="grid-2">
          <div class="field">
            <label>IP Address <span class="req">*</span></label>
            <input type="text" id="server" placeholder="0.0.0.0" autocomplete="off" spellcheck="false"/>
          </div>
          <div class="field">
            <label>Port <span class="req">*</span></label>
            <input type="text" id="port" placeholder="17091" autocomplete="off" spellcheck="false"/>
          </div>
        </div>

        <div class="field">
          <label>Login URL <span class="req">*</span></label>
          <input type="text" id="loginurl" placeholder="example.vercel.app" autocomplete="off" spellcheck="false"/>
        </div>

        <div class="field">
          <label>Meta / Server Name <span class="req">*</span></label>
          <input type="text" id="meta" placeholder="ServerName" autocomplete="off" spellcheck="false"/>
        </div>

        <div class="sep"></div>

        <div class="section-title">Maintenance</div>

        <div class="field">
          <label>Maintenance Message <span class="opt">optional</span></label>
          <textarea id="maint" placeholder="Kosongkan jika server aktif..."></textarea>
          <div class="hint">Isi teks → server masuk mode <b>maintenance</b>. Kosongkan → server berjalan normal.</div>
        </div>

        <div class="btn-wrap">
          <button class="btn" id="saveBtn" onclick="saveConfig()">
            <svg id="btnIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            <span id="btnText">Save Configuration</span>
          </button>
        </div>

        <div class="alert" id="alertBox">
          <div id="alertIcon" class="alert-icon"></div>
          <div id="alertMsg"></div>
        </div>
      </div>
    </div>

    <div class="footer">by Test &nbsp;·&nbsp; 2025</div>
  </div>

  <script>
    // Load config on page open — populate fields from saved config
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/get_config');
        if (res.ok) {
          const cfg = await res.json();
          document.getElementById('server').value   = cfg.server   || '';
          document.getElementById('port').value     = cfg.port     || '';
          document.getElementById('loginurl').value = cfg.loginurl || '';
          document.getElementById('meta').value     = cfg.meta     || '';
          document.getElementById('maint').value    = cfg.maint    || '';
        }
      } catch(e) { /* silent fail — fields stay empty */ }
    });

    async function saveConfig() {
      const btn    = document.getElementById('saveBtn');
      const btnTxt = document.getElementById('btnText');
      const btnIcon= document.getElementById('btnIcon');

      const data = {
        server:   document.getElementById('server').value.trim(),
        port:     document.getElementById('port').value.trim(),
        loginurl: document.getElementById('loginurl').value.trim(),
        meta:     document.getElementById('meta').value.trim(),
        maint:    document.getElementById('maint').value.trim(),
      };

      if (!data.server || !data.port || !data.loginurl || !data.meta) {
        showAlert('error', 'IP, Port, Login URL, dan Meta wajib diisi.');
        return;
      }

      // Loading
      btn.disabled = true;
      btnIcon.outerHTML = '<div class="spinner" id="btnIcon"></div>';
      btnTxt.textContent = 'Saving...';
      showAlert('loading', 'Mengirim konfigurasi ke GitHub...');

      try {
        const res  = await fetch('/api/save_config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();

        if (json.success) {
          showAlert('success', json.message || 'Konfigurasi berhasil disimpan!');
        } else {
          showAlert('error', json.message || 'Gagal menyimpan konfigurasi.');
        }
      } catch(e) {
        showAlert('error', 'Gagal konek ke server: ' + e.message);
      }

      btn.disabled = false;
      document.getElementById('btnIcon').outerHTML = `<svg id="btnIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`;
      btnTxt.textContent = 'Save Configuration';
    }

    function showAlert(type, message) {
      const box  = document.getElementById('alertBox');
      const msg  = document.getElementById('alertMsg');
      const icon = document.getElementById('alertIcon');

      const icons = {
        success: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
        error:   `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
        loading: `<div class="spinner" style="width:13px;height:13px;border-color:rgba(139,92,246,0.25);border-top-color:var(--accent-light)"></div>`,
      };

      box.className = `alert ${type} show`;
      icon.innerHTML = icons[type] || '';
      msg.textContent = message;
    }
  </script>
</body>
</html>
